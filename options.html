<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font:
          14px/1.4 system-ui,
          sans-serif;
        margin: 16px;
        min-width: 380px;
      }
      label {
        display: block;
        font-weight: 600;
        margin: 12px 0 4px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        font: inherit;
      }
      input:disabled,
      label:has(+ input:disabled) {
        opacity: 0.5;
      }
      .hint {
        font-size: 12px;
        opacity: 0.7;
        margin-top: 4px;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 16px;
        align-items: center;
      }
      button {
        padding: 6px 14px;
        font: inherit;
        cursor: pointer;
      }
      #status {
        font-size: 13px;
      }
      .ok {
        color: #16a34a;
      }
      .err {
        color: #dc2626;
      }
    </style>
  </head>
  <body>
    <label for="url">Seerr URL</label>
    <input id="url" type="url" placeholder="https://seerr.example.com" />

    <label for="apiKey">API key</label>
    <input
      id="apiKey"
      type="password"
      placeholder="Settings → General → API Key"
      autocomplete="off"
    />
    <div class="hint">
      Leave blank to use your browser login session instead. Requests made with
      the API key act as the admin account unless you set a username below.
    </div>

    <label for="username">Username</label>
    <input
      id="username"
      type="text"
      autocomplete="off"
      spellcheck="false"
      disabled
    />

    <div class="row">
      <button id="save">Save &amp; test</button>
      <span id="status"></span>
    </div>

    <script src="options.js"></script>
  </body>
</html>
